<!DOCTYPE html>
<html>
<head>
    <title data-i18n="title_admin_reg">Admin Registration - Study Treasure</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='register.css') }}">
</head>
<body>

    <div class="register-box">
        <h2 data-i18n="ar_heading">Admin Registration</h2>
        <p data-i18n="ar_sub">Create an administrator account</p>

        <form>
            <label data-i18n="lbl_full_name">Full Name</label>
            <input type="text" placeholder="Enter your full name" data-i18n-placeholder="ph_full_name_plain" required>

            <label data-i18n="lbl_admin_id">Admin ID</label>
            <input type="text" placeholder="Enter your admin ID" data-i18n-placeholder="ph_admin_id" required>

            <label data-i18n="lbl_email">Email</label>
            <input type="email" placeholder="Enter your email" data-i18n-placeholder="ph_email" required>

            <label data-i18n="lbl_admin_code">Admin Access Code</label>
            <input type="password" placeholder="Enter authorized access code" data-i18n-placeholder="ph_admin_code" required>

            <label data-i18n="lbl_password">Password</label>
            <input type="password" placeholder="Create a password" data-i18n-placeholder="ph_create_password_plain" required>

            <label data-i18n="lbl_confirm_password">Confirm Password</label>
            <input type="password" placeholder="Confirm your password" data-i18n-placeholder="ph_confirm_password" required>

            <button type="submit" data-i18n="btn_register">Register</button>
        </form>

        <p><a href="{{ url_for('home') }}" data-i18n="back_home">Back to Home</a></p>
    </div>

    <script src="{{ url_for('static', filename='translations.js') }}"></script>
    <script src="{{ url_for('static', filename='i18n.js') }}"></script>
</body>
</html>
