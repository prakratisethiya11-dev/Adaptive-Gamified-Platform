<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title_login">Study Treasure - Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
</head>
<body>

    <div class="login-container">
        <h1>Study Treasure</h1>
        <p class="subtitle" data-i18n="login_welcome">Welcome Back! Please Login</p>

        <!-- Added method="POST" and action -->
        <form id="loginForm" method="POST" action="{{ url_for('login') }}">

            <label for="role" data-i18n="login_as">Login As</label>
            <select id="role" name="role" required>
                <option value="" data-i18n="opt_select_category">Select Category</option>
                <option value="student" data-i18n="role_student">Student</option>
                <option value="faculty" data-i18n="role_faculty">Faculty</option>
                <option value="admin" data-i18n="role_admin">Admin</option>
            </select>

            <label for="email" data-i18n="lbl_email_address">Email Address</label>
            <input type="email" id="email" name="email"
                   placeholder="Enter your email" data-i18n-placeholder="ph_email" required>

            <label for="password" data-i18n="lbl_password">Password</label>
            <input type="password" id="password" name="password"
                   placeholder="Enter your password" data-i18n-placeholder="ph_password" required>

            <button type="submit" data-i18n="btn_login">Login</button>
        </form>

        <p class="register-text">
            <span data-i18n="not_registered">Not registered yet?</span>
            <a href="#" id="registerLink" data-i18n="register_here">Register Here</a>
        </p>
    </div>

    <!-- Phone-style Top-Center Toast Notification Container -->
    <div id="toastNotification" class="toast-notification">
        <span id="toastMessage"></span>
    </div>

    <!-- Toast Notification CSS Styling (Top-Center) -->
    <style>
        .toast-notification {
            position: fixed;
            top: 25px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: #ffffff;
            color: #1e293b;
            padding: 16px 28px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            font-family: 'Times New Roman', Times, serif;
            font-size: 16px;
            font-weight: 500;
            z-index: 99999;
            opacity: 0;
            transition: opacity 0.4s ease, transform 0.4s ease;
            border-bottom: 4px solid #4f46e5;
            white-space: normal;
            text-align: center;
            max-width: 90vw;
        }

        .toast-notification.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>

    <script src="{{ url_for('static', filename='translations.js') }}"></script>
    <script src="{{ url_for('static', filename='i18n.js') }}"></script>
    <script>
        const role = document.getElementById("role");

        const registerPages = {
            student: "{{ url_for('register') }}",
            faculty: "{{ url_for('faculty_register') }}",
            admin: "{{ url_for('admin_register') }}"
        };

        document.getElementById("registerLink").onclick = function(event) {
            event.preventDefault();

            if (role.value === "") {
                alert(t("alert_select_category"));
                return;
            }

            window.location.href = registerPages[role.value];
        };
    </script>

    <!-- Script to Trigger Notification and Handle Auto-Redirect -->
    {% if alert_message %}
    <script>
        window.addEventListener('DOMContentLoaded', function() {
            const toast = document.getElementById('toastNotification');
            const msgElem = document.getElementById('toastMessage');
            const serverMessage = {{ alert_message|tojson }};
            const redirectUrl = {{ (redirect_url or '')|tojson }};

            // Known server messages follow the selected language; others (e.g. database errors) are shown as they are
            msgElem.innerText = i18n.tServer(serverMessage);

            // Show notification in top-center
            toast.classList.add('show');

            // Hide and redirect after 2 seconds automatically
            setTimeout(function() {
                toast.classList.remove('show');
                if (redirectUrl) {
                    window.location.href = redirectUrl;
                }
            }, 2000);
        });
    </script>
    {% endif %}

</body>
</html>
